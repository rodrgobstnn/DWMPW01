<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fit Express | Autenticación de Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card fit-card border-0 shadow-sm p-4 p-md-5">

          <div class="text-center mb-4">
            <a href="index.html" class="text-decoration-none">
              <i class="bi bi-activity text-brand-yellow fs-1"></i>
              <h3 class="fw-bold text-brand-black mb-0">Fit<span class="text-brand-yellow">Express</span></h3>
            </a>
            <p class="text-muted small mt-2">Acceso al sistema según perfil asignado</p>
          </div>

          <form id="formAuth" class="needs-validation" novalidate>
            <!-- Selector de perfil asignado (RF 12) -->
            <div class="mb-3">
              <label for="rol" class="form-label small fw-semibold">Perfil de Acceso</label>
              <select class="form-select" id="rol" required>
                <option value="cliente" selected>Cliente Registrado</option>
                <option value="cajero">Cajero Virtual (Funcionario)</option>
                <option value="despacho">Encargado de Despacho</option>
                <option value="admin">Administrador / Dueño</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="correo" class="form-label small fw-semibold">Correo Electrónico</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control" id="correo" placeholder="usuario@fitexpress.cl" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label small fw-semibold">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" class="btn btn-fit-primary w-100 fw-bold mb-3">
              Ingresar al Sistema
            </button>

            <div class="text-center pt-2 border-top">
              <span class="text-muted small">¿Eres nuevo cliente?</span>
              <a href="registro.html" class="text-brand-yellow text-decoration-none fw-semibold small ms-1">Regístrate</a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('formAuth').addEventListener('submit', (e) => {
      e.preventDefault();
      const rol = document.getElementById('rol').value;
      const email = document.getElementById('correo').value;

      // Guardar sesión (RNF 7)
      sessionStorage.setItem('fit_usuario', JSON.stringify({ email, rol }));

      // Redirección controlada por rol (RF 12)
      if (rol === 'cajero') {
        window.location.href = 'caja.html';
      } else if (rol === 'despacho') {
        window.location.href = 'despacho.html';
      } else if (rol === 'admin') {
        window.location.href = 'admin-productos.html';
      } else {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
