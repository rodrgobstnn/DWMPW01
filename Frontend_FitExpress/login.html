<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fit Express | Mantenedor de Productos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg bg-white border-bottom py-3">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4 text-brand-black d-flex align-items-center" href="index.html">
        <i class="bi bi-activity text-brand-yellow me-2 fs-3"></i>
        <span>Fit<span class="text-brand-yellow">Express</span></span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <span id="adminBadge" class="badge bg-dark text-warning d-none d-md-inline-block"></span>
        <a href="reportes.html" class="btn btn-outline-dark btn-sm rounded-pill">Ver Reportes</a>
        <button id="btnSalir" class="btn btn-outline-danger btn-sm rounded-pill">Salir</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="fw-bold text-brand-black mb-1">Maestro de Productos y Disponibilidad</h3>
        <p class="text-muted small mb-0">Administración de stock, precios y activación en la carta web.</p>
      </div>
      <button class="btn btn-fit-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalNuevoProducto">
        <i class="bi bi-plus-circle me-1"></i> Nuevo Producto
      </button>
    </div>

    <div id="adminToast" class="alert d-none small py-2 mb-3"></div>

    <div class="card fit-card p-4">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light small text-uppercase">
            <tr>
              <th>ID</th>
              <th>Producto</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Disponibilidad (Menú Web)</th>
              <th>Macros</th>
            </tr>
          </thead>
          <tbody id="tbodyProductos">
            <tr>
              <td colspan="6" class="text-center text-muted py-4">Cargando catálogo desde el servidor...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Nuevo Producto -->
  <div class="modal fade" id="modalNuevoProducto" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title fs-6 fw-bold">Agregar Nuevo Producto</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="formNuevoProducto">
          <div class="modal-body p-4">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Nombre del Producto</label>
              <input type="text" id="prodNombre" class="form-control" required placeholder="Ej: Tuna Poke Bowl">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Categoría</label>
              <select id="prodCategoria" class="form-select" required>
                <option value="bowls">Bowls Proteicos</option>
                <option value="snacks">Snacks</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Precio ($ CLP)</label>
              <input type="number" id="prodPrecio" class="form-control" required min="500" placeholder="Ej: 7990">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Información Nutricional (Macros)</label>
              <input type="text" id="prodMacros" class="form-control" required placeholder="Ej: 40g Proteína" value="38g Proteína">
            </div>
          </div>
          <div class="modal-footer bg-light">
            <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-sm btn-fit-primary">Guardar Producto</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_GATEWAY = "http://127.0.0.1:8000/api/v1";
    const token = sessionStorage.getItem('fit_token');
    const usuario = JSON.parse(sessionStorage.getItem('fit_usuario') || '{}');

    // 1. Guardia de seguridad RBAC en Frontend
    if (!token || !usuario.roles || (!usuario.roles.includes('ADMIN') && !usuario.roles.includes('OWNER'))) {
      window.location.href = 'login.html';
    } else {
      document.getElementById('adminBadge').textContent = usuario.email;
    }

    function mostrarMensaje(texto, tipo = "success") {
      const box = document.getElementById('adminToast');
      box.className = `alert alert-${tipo} small py-2 mb-3`;
      box.textContent = texto;
      box.classList.remove('d-none');
      setTimeout(() => box.classList.add('d-none'), 3500);
    }

    // 2. Cargar catálogo completo (GET)
    async function cargarProductos() {
      const tbody = document.getElementById('tbodyProductos');
      try {
        const res = await fetch(`${API_GATEWAY}/inventory/catalog?onlyAvailable=false`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.status === 401 || res.status === 403) {
          cerrarSesion();
          return;
        }

        const productos = await res.json();
        tbody.innerHTML = '';

        productos.forEach(p => {
          const catTexto = p.categoria === 'bowls' ? 'Bowls Proteicos' : 'Snacks';
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>#${p.id}</strong></td>
            <td><strong>${p.nombre}</strong></td>
            <td>${catTexto}</td>
            <td>$${Number(p.precio).toLocaleString('es-CL')}</td>
            <td>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="switch${p.id}" 
                       ${p.disponible ? 'checked' : ''} 
                       onchange="actualizarDisponibilidad(${p.id}, this.checked)">
                <label class="form-check-label small fw-semibold ${p.disponible ? 'text-success' : 'text-danger'}" 
                       for="switch${p.id}" id="label${p.id}">
                  ${p.disponible ? 'Disponible' : 'No Disponible'}
                </label>
              </div>
            </td>
            <td><span class="badge bg-light text-dark border">${p.macros || 'N/A'}</span></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-danger text-center">Error de conexión con API Gateway: ${err.message}</td></tr>`;
      }
    }

    // 3. Actualizar disponibilidad en vivo (PATCH)
    async function actualizarDisponibilidad(prodId, disponible) {
      const label = document.getElementById(`label${prodId}`);
      const checkbox = document.getElementById(`switch${prodId}`);

      try {
        const res = await fetch(`${API_GATEWAY}/inventory/products/${prodId}/availability?available=${disponible}`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "No autorizado para cambiar disponibilidad");

        label.className = `form-check-label small fw-semibold ${disponible ? 'text-success' : 'text-danger'}`;
        label.textContent = disponible ? 'Disponible' : 'No Disponible';
        mostrarMensaje(`Stock actualizado: ${data.nombre} ahora está ${disponible ? 'Disponible' : 'No Disponible'}.`, "success");
      } catch (err) {
        checkbox.checked = !disponible; // Revertir switch si falla
        mostrarMensaje(err.message, "danger");
      }
    }

    // 4. Crear nuevo producto desde el Modal (POST)
    document.getElementById('formNuevoProducto').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        nombre: document.getElementById('prodNombre').value.trim(),
        categoria: document.getElementById('prodCategoria').value,
        precio: parseInt(document.getElementById('prodPrecio').value, 10),
        macros: document.getElementById('prodMacros').value.trim()
      };

      try {
        const res = await fetch(`${API_GATEWAY}/inventory/products`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Error al crear producto");

        const modalEl = document.getElementById('modalNuevoProducto');
        bootstrap.Modal.getInstance(modalEl).hide();
        e.target.reset();
        mostrarMensaje(`Producto "${data.nombre}" creado correctamente con ID #${data.id}.`, "success");
        cargarProductos();
      } catch (err) {
        mostrarMensaje(err.message, "danger");
      }
    });

    function cerrarSesion() {
      sessionStorage.removeItem('fit_token');
      sessionStorage.removeItem('fit_usuario');
      window.location.href = 'login.html';
    }

    document.getElementById('btnSalir').addEventListener('click', cerrarSesion);
    document.addEventListener('DOMContentLoaded', cargarProductos);
  </script>
</body>
</html>
