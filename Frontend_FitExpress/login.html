<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fit Express | Autenticación de Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card fit-card border-0 shadow-sm p-4 p-md-5">

          <div class="text-center mb-4">
            <a href="index.html" class="text-decoration-none">
              <i class="bi bi-activity text-brand-yellow fs-1"></i>
              <h3 class="fw-bold text-brand-black mb-0">Fit<span class="text-brand-yellow">Express</span></h3>
            </a>
            <p class="text-muted small mt-2">Acceso al sistema según perfil asignado</p>
          </div>

          <div id="authAlert" class="alert d-none small py-2" role="alert"></div>

          <form id="formAuth" class="needs-validation" novalidate>
            <div class="mb-3">
              <label for="rol" class="form-label small fw-semibold">Perfil de Acceso</label>
              <select class="form-select" id="rol" required>
                <option value="CLIENT" selected>Cliente Registrado</option>
                <option value="CASHIER">Cajero Virtual (Funcionario)</option>
                <option value="DISPATCH">Encargado de Despacho</option>
                <option value="ADMIN">Administrador / Dueño</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="correo" class="form-label small fw-semibold">Correo Electrónico</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control" id="correo" placeholder="usuario@fitexpress.cl" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label small fw-semibold">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn btn-fit-primary w-100 fw-bold mb-3">
              Ingresar al Sistema
            </button>

            <div class="text-center pt-2 border-top">
              <span class="text-muted small">¿Eres nuevo cliente?</span>
              <a href="registro.html" class="text-brand-yellow text-decoration-none fw-semibold small ms-1">Regístrate</a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_GATEWAY = "http://127.0.0.1:8000/api/v1";

    document.getElementById('formAuth').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const selectedRole = document.getElementById('rol').value;
      const username = document.getElementById('correo').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('authAlert');
      const btnSubmit = document.getElementById('btnSubmit');

      alertBox.classList.add('d-none');
      btnSubmit.disabled = true;
      btnSubmit.textContent = "Verificando credenciales...";

      try {
        const res = await fetch(`${API_GATEWAY}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || "Credenciales incorrectas");
        }

        const userRoles = data.user.roles || [];

        if (!userRoles.includes(selectedRole) && !(selectedRole === "ADMIN" && userRoles.includes("OWNER"))) {
          throw new Error(`El usuario ${username} no tiene permisos asignados para el perfil seleccionado.`);
        }

        sessionStorage.setItem('fit_token', data.access_token);
        sessionStorage.setItem('fit_usuario', JSON.stringify({
          user_id: data.user.user_id,
          email: data.user.email,
          roles: userRoles
        }));

        if (userRoles.includes('ADMIN') || userRoles.includes('OWNER')) {
          window.location.href = 'admin-productos.html';
        } else if (userRoles.includes('CASHIER')) {
          window.location.href = 'caja.html';
        } else if (userRoles.includes('DISPATCH')) {
          window.location.href = 'despacho.html';
        } else {
          window.location.href = 'index.html';
        }

      } catch (err) {
        alertBox.className = "alert alert-danger small py-2";
        alertBox.textContent = err.message;
        alertBox.classList.remove('d-none');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Ingresar al Sistema";
      }
    });
  </script>
</body>
</html>
